[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "2oneox720-templated"
version = "0.1.0"
description = "从输入中抽取数值，计算生成的模板化表达相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "2oneox720" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://2oneox720.github.io"
Repository = "https://github.com/2oneox720/templated"
Issues = "https://github.com/2oneox720/templated/issues"

[project.scripts]
templated = "templated:main"

[tool.setuptools]
py-modules = ["templated"]
